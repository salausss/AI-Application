apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-svc
  namespace: argus
spec:
  replicas: 2
  selector:
    matchLabels: {app: auth-svc}
  template:
    metadata:
      labels: {app: auth-svc}
    spec:
      serviceAccountName: argus-sa
      containers:
        - name: auth-svc
          image: 844074033173.dkr.ecr.ap-south-1.amazonaws.com/argus/auth-svc:latest
          ports: [{containerPort: 8000}]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: argus-secrets, key: POSTGRES_PASSWORD}}
            - name: DATABASE_URL
              value: "postgresql://argus:$(POSTGRES_PASSWORD)@postgres:5432/argus"
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: argus-secrets, key: JWT_SECRET}}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 15
          resources:
            requests: {cpu: "100m", memory: "256Mi"}
            limits: {cpu: "500m", memory: "512Mi"}
---
apiVersion: v1
kind: Service
metadata:
  name: auth-svc
  namespace: argus
spec:
  selector: {app: auth-svc}
  ports: [{port: 8000, targetPort: 8000}]