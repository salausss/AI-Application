apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chromadb
  namespace: argus
spec:
  serviceName: chromadb
  replicas: 1
  selector:
    matchLabels: {app: chromadb}
  template:
    metadata:
      labels: {app: chromadb}
    spec:
      containers:
        - name: chromadb
          image: chromadb/chroma:latest
          ports: [{containerPort: 8000}]
          volumeMounts:
            - {name: chromadata, mountPath: /chroma/chroma}
  volumeClaimTemplates:
    - metadata: {name: chromadata}
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp2-retain
        resources: {requests: {storage: 10Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: chromadb
  namespace: argus
spec:
  selector: {app: chromadb}
  ports: [{port: 8000, targetPort: 8000}]