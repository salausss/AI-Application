apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argus-ingress
  namespace: argus
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  rules:
    - http:
        paths:
          - path: /api/v1/chat
            pathType: Prefix
            backend: {service: {name: chat-svc, port: {number: 8000}}}
          - path: /api/v1/auth
            pathType: Prefix
            backend: {service: {name: auth-svc, port: {number: 8000}}}
          - path: /
            pathType: Prefix
            backend: {service: {name: web-ui, port: {number: 3000}}}