apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-svc
  namespace: argus
spec:
  replicas: 1
  selector:
    matchLabels: {app: ingestion-svc}
  template:
    metadata:
      labels: {app: ingestion-svc}
    spec:
      serviceAccountName: argus-sa
      containers:
        - name: ingestion-svc
          image: <account-id>.dkr.ecr.ap-south-1.amazonaws.com/ingestion-svc:latest
          ports: [{containerPort: 8000}]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: argus-secrets, key: POSTGRES_PASSWORD}}
            - name: DATABASE_URL
              value: "postgresql://argus:$(POSTGRES_PASSWORD)@postgres:5432/argus"
            - {name: CHROMA_HOST, value: "chromadb"}
            - {name: AWS_REGION, value: "ap-south-1"}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 15
          resources:
            requests: {cpu: "100m", memory: "256Mi"}
            limits: {cpu: "500m", memory: "512Mi"}
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion-svc
  namespace: argus
spec:
  selector: {app: ingestion-svc}
  ports: [{port: 8000, targetPort: 8000}]