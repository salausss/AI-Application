apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-svc
  namespace: argus
spec:
  replicas: 2
  selector:
    matchLabels: {app: chat-svc}
  template:
    metadata:
      labels: {app: chat-svc}
    spec:
      serviceAccountName: argus-sa   # IRSA — reuse your Bedrock MLOps IAM role pattern for Bedrock access
      containers:
        - name: chat-svc
          image: 844074033173.dkr.ecr.ap-south-1.amazonaws.com/argus/chat-svc:latest
          imagePullPolicy: Always
          ports: [{containerPort: 8000}]
          env:
          - name: POSTGRES_PASSWORD
            valueFrom: {secretKeyRef: {name: argus-secrets, key: POSTGRES_PASSWORD}}
          - name: DATABASE_URL
            value: "postgresql://argus:$(POSTGRES_PASSWORD)@postgres:5432/argus"
          - name: RETRIEVAL_URL
            value: "http://retrieval-svc:8000"
          - name: AWS_REGION
            value: "ap-south-1"
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 15
          resources:
            requests: {cpu: "100m", memory: "256Mi"}
            limits: {cpu: "500m", memory: "512Mi"}
---
apiVersion: v1
kind: Service
metadata:
  name: chat-svc
  namespace: argus
spec:
  selector: {app: chat-svc}
  ports: [{port: 8000, targetPort: 8000}]