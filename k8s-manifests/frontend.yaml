apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-ui
  namespace: argus
spec:
  replicas: 2
  selector:
    matchLabels: {app: web-ui}
  template:
    metadata:
      labels: {app: web-ui}
    spec:
      containers:
        - name: web-ui
          image: 844074033173.dkr.ecr.ap-south-1.amazonaws.com/argus/frontend:latest
          ports: [{containerPort: 80}]
          readinessProbe:
            httpGet: {path: /, port: 80}
            initialDelaySeconds: 5
          resources:
            requests: {cpu: "50m", memory: "64Mi"}
            limits: {cpu: "200m", memory: "128Mi"}
---
apiVersion: v1
kind: Service
metadata:
  name: web-ui
  namespace: argus
spec:
  selector: {app: web-ui}
  ports: [{port: 3000, targetPort: 80}]