apiVersion: apps/v1
kind: Deployment
metadata:
  name: retrieval-svc
  namespace: argus
spec:
  replicas: 2
  selector:
    matchLabels: {app: retrieval-svc}
  template:
    metadata:
      labels: {app: retrieval-svc}
    spec:
      serviceAccountName: argus-sa
      containers:
        - name: retrieval-svc
          image: <account-id>.dkr.ecr.ap-south-1.amazonaws.com/retrieval-svc:latest
          ports: [{containerPort: 8000}]
          env:
            - {name: CHROMA_HOST, value: "chromadb"}
            - {name: AWS_REGION, value: "ap-south-1"}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 15
          resources:
            requests: {cpu: "100m", memory: "256Mi"}
            limits: {cpu: "500m", memory: "512Mi"}
---
apiVersion: v1
kind: Service
metadata:
  name: retrieval-svc
  namespace: argus
spec:
  selector: {app: retrieval-svc}
  ports: [{port: 8000, targetPort: 8000}]