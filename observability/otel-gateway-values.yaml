mode: deployment
replicaCount: 2

image:
  repository: otel/opentelemetry-collector-contrib

command:
  name: otelcol-contrib

presets:
  kubernetesAttributes:
    enabled: true   # enriches telemetry with pod/namespace/node metadata

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    memory_limiter:
      check_interval: 1s
      limit_percentage: 80
      spike_limit_percentage: 25
    batch:
      send_batch_size: 8192
      timeout: 5s

  exporters:
    debug:
      verbosity: basic

  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [debug]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [debug]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [debug]

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    memory: 512Mi

podDisruptionBudget:
  enabled: true
  minAvailable: 1