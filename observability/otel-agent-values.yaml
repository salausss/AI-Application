mode: daemonset

image:
  repository: otel/opentelemetry-collector-contrib

command:
  name: otelcol-contrib

presets:
  kubernetesAttributes:
    enabled: true
  logsCollection:
    enabled: true          # auto-injects filelog receiver + adds it to logs pipeline
    includeCollectorLogs: false
  kubeletMetrics:
    enabled: true          # auto-injects kubeletstats receiver
  hostMetrics:
    enabled: true          # auto-injects hostmetrics receiver

config:
  processors:
    memory_limiter:
      check_interval: 1s
      limit_percentage: 80
      spike_limit_percentage: 25
    batch: {}

  exporters:
    otlp:
      endpoint: otel-gateway-opentelemetry-collector.observability.svc.cluster.local:4317
      tls:
        insecure: true    # fine inside the cluster for a lab; use mTLS in production

  service:
    pipelines:
      logs:
        exporters: [otlp]
      metrics:
        exporters: [otlp]

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi