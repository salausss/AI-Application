<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Argus — AI Assistant</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; background:#0f172a; color:#e2e8f0; }
  #login, #chat { display: none; }
  input, button, textarea { font-size: 15px; padding: 8px; border-radius: 6px; border: 1px solid #334155; }
  input, textarea { background:#1e293b; color:#e2e8f0; width: 100%; box-sizing: border-box; margin-bottom: 8px; }
  button { background:#3b82f6; color:white; border:none; cursor:pointer; padding: 10px 16px; }
  #messages { border: 1px solid #334155; border-radius: 8px; padding: 12px; height: 400px; overflow-y: auto; margin-bottom: 12px; }
  .msg { margin-bottom: 14px; }
  .role-user { color:#93c5fd; font-weight:600; }
  .role-assistant { color:#86efac; font-weight:600; }
  .citations { font-size: 12px; color:#94a3b8; margin-top: 4px; }
  .row { display:flex; gap:8px; }
  .row input { flex:1; }
</style>
</head>
<body>

<div id="login">
  <h2>Argus — sign in</h2>
  <input id="email" placeholder="email" />
  <input id="password" type="password" placeholder="password" />
  <div class="row">
    <button onclick="login()">Log in</button>
    <button onclick="register()">Register</button>
  </div>
  <p id="login-error" style="color:#f87171"></p>
</div>

<div id="chat">
  <h2>Argus</h2>
  <div id="messages"></div>
  <div class="row">
    <input id="message-input" placeholder="Ask something…" onkeydown="if(event.key==='Enter') sendMessage()" />
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
  const AUTH_URL = "";
  const CHAT_URL = "";

  let accessToken = localStorage.getItem("argus_token");
  let sessionId = null;

  function show(id) {
    document.getElementById("login").style.display = id === "login" ? "block" : "none";
    document.getElementById("chat").style.display = id === "chat" ? "block" : "none";
  }

  async function register() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const res = await fetch(`${AUTH_URL}/api/v1/auth/register`, {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({email, password})
    });
    if (res.ok) { await login(); } else {
      document.getElementById("login-error").innerText = "Registration failed — " + (await res.text());
    }
  }

  async function login() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const res = await fetch(`${AUTH_URL}/api/v1/auth/login`, {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({email, password})
    });
    if (!res.ok) {
      document.getElementById("login-error").innerText = "Login failed";
      return;
    }
    const data = await res.json();
    accessToken = data.access_token;
    localStorage.setItem("argus_token", accessToken);
    show("chat");
  }

  function appendMessage(role, content, citations) {
    const div = document.createElement("div");
    div.className = "msg";
    let html = `<div class="role-${role}">${role}</div><div>${content}</div>`;
    if (citations && citations.length) {
      html += `<div class="citations">Sources: ${citations.map(c => c.chunk_id.slice(0,8)).join(", ")}</div>`;
    }
    div.innerHTML = html;
    document.getElementById("messages").appendChild(div);
    div.scrollIntoView();
  }

  async function sendMessage() {
    const input = document.getElementById("message-input");
    const message = input.value.trim();
    if (!message) return;
    input.value = "";
    appendMessage("user", message);

    const res = await fetch(`${CHAT_URL}/api/v1/chat`, {
      method: "POST",
      headers: {"Content-Type": "application/json", "Authorization": `Bearer ${accessToken}`},
      body: JSON.stringify({session_id: sessionId, message})
    });
    if (!res.ok) {
      appendMessage("assistant", `Error: ${res.status}`);
      return;
    }
    const data = await res.json();
    sessionId = data.session_id;
    appendMessage("assistant", data.answer, data.citations);
  }

  show(accessToken ? "chat" : "login");
</script>
</body>
</html>
